# Application
spring.application.name=tourmanager-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tourmanager
spring.datasource.username=tourmanager_user
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

spring.jpa.open-in-view=false